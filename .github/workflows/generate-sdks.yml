name: Generate Client SDKs

on:
  push:
    branches: [ main ]
    paths:
      - 'openapi.yaml'
      - 'openapi.json'

jobs:
  build-sdks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Generate Python Client
      - name: Generate Python SDK
        run: |
          docker run --rm -v ${{ github.workspace }}:/local openapitools/openapi-generator-cli generate \
            -i /local/openapi.yaml \
            -g python \
            -o /local/sdks/python \
            --additional-properties=packageName=jgsp_client

      # 2. Generate TypeScript Client
      - name: Generate TypeScript SDK
        run: |
          docker run --rm -v ${{ github.workspace }}:/local openapitools/openapi-generator-cli generate \
            -i /local/openapi.yaml \
            -g typescript-fetch \
            -o /local/sdks/typescript

      # 3. Generate Go Client
      - name: Generate Go SDK
        run: |
          docker run --rm -v ${{ github.workspace }}:/local openapitools/openapi-generator-cli generate \
            -i /local/openapi.yaml \
            -g go \
            -o /local/sdks/go \
            --additional-properties=packageName=jgsp

      # 4. Commit and Push Back to Main
      - name: Commit Generated SDKs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add sdks/
          if git diff-index --quiet HEAD -- sdks/; then
            echo "No changes detected in SDKs."
          else
            git commit -m "chore(ci): auto-generate multi-language SDKs"
            git push
          fi

name: Create GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # SDKs are generated on the fly so the release always ships them,
      # even if generate-sdks.yml hasn't committed them to the branch yet.
      - name: Generate Python SDK
        run: |
          docker run --rm -v ${{ github.workspace }}:/local openapitools/openapi-generator-cli generate \
            -i /local/openapi.yaml \
            -g python \
            -o /local/sdks/python \
            --additional-properties=packageName=jgsp_client

      - name: Generate TypeScript SDK
        run: |
          docker run --rm -v ${{ github.workspace }}:/local openapitools/openapi-generator-cli generate \
            -i /local/openapi.yaml \
            -g typescript-fetch \
            -o /local/sdks/typescript

      - name: Generate Go SDK
        run: |
          docker run --rm -v ${{ github.workspace }}:/local openapitools/openapi-generator-cli generate \
            -i /local/openapi.yaml \
            -g go \
            -o /local/sdks/go \
            --additional-properties=packageName=jgsp

      - name: Generate C++ SDK
        run: |
          docker run --rm -v ${{ github.workspace }}:/local openapitools/openapi-generator-cli generate \
            -i /local/openapi.yaml \
            -g cpp-restsdk \
            -o /local/sdks/cpp \
            --additional-properties=packageName=jgsp

      - name: Create SDK Archives
        run: |
          tar -czvf python-sdk.tar.gz -C sdks/python .
          tar -czvf typescript-sdk.tar.gz -C sdks/typescript .
          tar -czvf go-sdk.tar.gz -C sdks/go .
          tar -czvf cpp-sdk.tar.gz -C sdks/cpp .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            openapi.yaml
            python-sdk.tar.gz
            typescript-sdk.tar.gz
            go-sdk.tar.gz
            cpp-sdk.tar.gz
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

openapi: 3.0.3
info:
  title: GSPNS / NSmart Public Transport API (Novi Sad)
  version: "1.2.0"
  description: |
    Unofficial documentation of the reverse-engineered API behind the GSPNS (JGSP "Novi Sad")
    public transport network — the same API used by the **NSmart** mobile app
    (`buslogic.nsmartapp`).

    The API is served by **BusLogic/NSmart** (`online.nsmart.rs`) and provides:

    * the static transport network (cities → stations → line pairs),
    * real-time vehicle positions and arrival predictions per station,
    * electronic ticketing / wallet / card management endpoints (login, e-wallet, top-up…).

    ## Reverse engineering provenance

    * Endpoint paths, class names and the shared API key were recovered from the
      NSmart 4.6 Android APK (see [FmasterofU/NSmart-RE](https://github.com/FmasterofU/NSmart-RE)).
    * Response schemas below were verified against the live API in September 2026.
    * The API key (`4670f468049bbee2260`) is compiled into the public APK as
      `company_api_key` and is the same for every install — treat it as public knowledge.

    ## Authentication

    Every request must send the header:

    ```
    X-Api-Authentication: 4670f468049bbee2260
    ```

    All endpoints in this document include that header in their `security` requirements.

    ## Notes & quirks (learned the hard way)

    * The giant network payload (`networkextended.php`) is **not valid JSON when served
      over a slow connection** — the server truncates / corrupts the stream mid-body
      (raw control characters, null-byte runs, dropped chunks). The NSmart app
      apparently tolerates this; re-request until you get a parseable body.
    * `networkextended.php` ignores semantically different `action` values
      (`get_network`, `get_trips`, `get_schedule` return the same cities payload as
      `get_cities_extended`).
    * `announcement.php` returns `[{"success":false,"code":3}]` for an unknown
      `station_uid`. For a *known* station with nothing due it returns a single
      placeholder entry (`{"just_coordinates":"1", ...}`) instead of an empty array.
    * A vehicle without a GPS fix is reported at `lat: "0.00000000"`, `lng: "0.00000000"`
      (often with an empty `garageNo`) — treat `0,0` as "position unknown".
    * `networkextended.php` also answers a plain `GET` with no parameters, and the payload
      holds far more than `cities`: the flat `stations` and `lines` lists are what most
      clients want (see the `Network` schema and `docs/data-notes.md`).
    * Timetables (scheduled departures) are **not** served by this API — see
      `docs/timetables.md` for the official gspns.co.rs pages that carry them.
    * `ibfm=TM00000` means "all lines"; pass a line code (e.g. `7A`) to filter.
    * Serbian text is `UTF-8`; strings may come back with JS-style unicode escapes.

  contact:
    name: Reverse-engineered for a university course
  license:
    name: Unofficial — not affiliated with GSPNS/NSmart
externalDocs:
  description: NSmart-RE (APK reverse engineering walkthrough)
  url: https://github.com/FmasterofU/NSmart-RE
servers:
  - url: https://online.nsmart.rs
    description: Production NSmart API used by GSPNS Novi Sad
security:
  - ApiKeyAuth: []
tags:
  - name: Network
    description: Static transport network (cities, stations, line pairs)
  - name: Realtime
    description: Live arrivals, vehicle positions and per-station predictions
  - name: Account
    description: Authentication and user account management
  - name: Wallet & Cards
    description: Electronic wallet, monthly cards, NFC cards, credit cards, QR tickets
  - name: Payments
    description: AllSecure payment gateway integration
  - name: Misc
    description: Version checks, policies, invoices, settings
paths:
  /publicapi/v1/networkextended.php:
    post:
      tags: [Network]
      summary: Get the full transport network (cities with stations)
      description: |
        Returns every city served by the network, each with its station IDs, "pairs" (line
        pair IDs per station), default station, coordinates and country.

        **Novi Sad** is city `id: 72` with `452` stations (default station `7`).

        ⚠️ The response body is ~1.2 MB and the server can corrupt/truncate it mid-stream —
        re-request on parse failure (see info section).
      operationId: getNetwork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [get_cities_extended, get_network, get_trips, get_schedule]
                  default: get_cities_extended
                  description: Action verb. Observed values all return the same network payload.
            examples:
              default:
                value:
                  action: get_cities_extended
      responses:
        "200":
          description: The complete network (cities → stations → pairs)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
              example:
                cities:
                  - id: 72
                    name: Novi Sad
                    gbname: ""
                    default_station: 7
                    coordinates:
                      latitude: 0
                      longitude: 0
                    country:
                      name: Serbia
                      alpha2_code: RS
                    classes: ""
                    stations: [6801, 6548, 6726, 12883]
                    pairs: [72, 76, 1473, 72]
                    slugs: novisad
                    has_train_station: true
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Network]
      summary: Get the transport network (GET variant)
      description: |
        Same as POST but with the action passed as a query parameter.
        **Note:** as of September 2026 the server returned `403 Forbidden` for unauthenticated
        GET requests without the API key; with the key it works. Kept for completeness.
      operationId: getNetworkGet
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            default: get_cities_extended
      responses:
        "200":
          $ref: "#/components/responses/NetworkResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /publicapi/v1/announcement/announcement.php:
    get:
      tags: [Realtime]
      summary: Get live arrivals & vehicle positions for a station
      description: |
        Returns real-time departure/arrival predictions for every upcoming vehicle at the
        given station. Each entry describes one approaching vehicle: seconds left until it
        reaches the station, its current GPS position, how many stations away it is, the
        garage (vehicle) number, and the full station sequence of its line.

        Use `ibfm=TM00000` for all lines, or a specific line code (e.g. `7A`) to filter.

        If a known station has nothing due, the array holds a single placeholder object
        instead of arrivals (see the `no-arrivals` example) — filter for entries that have
        a numeric `seconds_left`. A vehicle whose GPS position is unknown is reported at
        `0,0`.
      operationId: getStationAnnouncements
      parameters:
        - name: ibfm
          in: query
          description: Line filter. `TM00000` = all lines; otherwise a line code such as `7A` or `8`.
          required: true
          schema:
            type: string
            default: TM00000
          example: TM00000
        - name: station_uid
          in: query
          description: Station ID (see network endpoint for the full station list). E.g. 6532 = "Narodnog fronta-Šekspirova".
          required: true
          schema:
            type: integer
            minimum: 1
          example: 6532
      responses:
        "200":
          description: |
            Array of approaching vehicles with predictions.
            For an unknown/invalid station_uid the server returns an error array
            instead: `[{"success":false,"code":3}]`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
              examples:
                multiple-lines:
                  summary: All lines at station 6532
                  value:
                    - seconds_left: 1670
                      line_number: "7A"
                      stations_gpsx: "45.2401130864"
                      stations_gpsy: "19.8370251247"
                      station_name: "Narodnog fronta-Šekspirova"
                      actual_line_number: "7A"
                      stations_between: 17
                      garage_no: "1102"
                      line_title: "NOVO NASELJE - ŽELEZNIČKA STANICA - FUTOŠKA PIJACA - LIMAN 4 - NOVO NASELJE"
                      main_line_title: "NOVO NASELJE - ŽELEZNIČKA STANICA - FUTOŠKA PIJACA - LIMAN 4 - NOVO NASELJE"
                      vehicles:
                        - garageNo: "1102"
                          lat: "45.24890660"
                          lng: "19.79147330"
                      all_stations:
                        - id: 13219
                          coordinates:
                            latitude: "45.2481177952"
                            longitude: "19.7860623227"
                      station_uid: 6532
                no-arrivals:
                  summary: Known station, nothing due (placeholder entry)
                  value:
                    - gpsx: "45.3141430070"
                      gpsy: "19.8293094486"
                      just_coordinates: "1"
                      station_name: "Agrovojvodina"
                      station_uid: 6801
                invalid-station:
                  summary: Unknown station_uid (error envelope)
                  value:
                    - success: false
                      code: 3
  /publicapi/v1/rest_options/android_login.php:
    post:
      tags: [Account]
      summary: Account actions (login, register, reset password…)
      description: |
        Single dispatcher endpoint for account-related actions, selected via the `action`
        form parameter. Observed behaviours (September 2026):

        * `action=register` → `{"success":false,"msg":"SIGNUP_FORM_NOT_CONFIGURED"}` (registration disabled for this operator)
        * `action=login` and most other verbs → `[]` (empty array)
        * missing `action` → plain text `POTREBAN JE PARAMETAR ACTION` ("ACTION parameter is required")

        The full set of actions is not publicly documented; the NSmart APK shows
        login, register, social login (Google/Facebook), reset password and email
        verification flows.
      operationId: accountAction
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  description: Account action verb.
                  enum: [login, register, reset_password, verify_email]
                  example: register
                email:
                  type: string
                  format: email
                  description: Used by login/register/reset flows.
                password:
                  type: string
                  format: password
                first_name:
                  type: string
                last_name:
                  type: string
            examples:
              register:
                value:
                  action: register
                  email: student@example.com
                  password: "secret"
                  first_name: Nikola
                  last_name: Tesla
      responses:
        "200":
          description: Action-dependent result (array or status object)
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {}
                  - $ref: "#/components/schemas/ApiStatus"
              examples:
                login-idle:
                  summary: Login with no session
                  value: []
                register-disabled:
                  summary: Registration disabled for JGSP Novi Sad
                  value:
                    success: false
                    msg: SIGNUP_FORM_NOT_CONFIGURED
        "400":
          description: Missing action parameter (plain text, not JSON)
          content:
            text/plain:
              schema:
                type: string
              example: POTREBAN JE PARAMETAR ACTION
  /publicapi/v1/rest_options/android_additional_options.php:
    post:
      tags: [Wallet & Cards]
      summary: Additional card/ticket options
      description: |
        Dispatcher for extra options (prepaid cards, additional settings). Observed to
        return `[]` for unknown `action` values. Real action verbs are embedded in the
        NSmart APK (card types, existing NFC/paper cards, online QR codes…).
      operationId: additionalOptions
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  description: Option action verb.
            examples:
              default:
                value:
                  action: get_card_types
      responses:
        "200":
          description: Options payload (array of objects)
          content:
            application/json:
              schema:
                type: array
                items: {}
              example: []
  /publicapi/v1/rest_options/android_additional_settings.php:
    post:
      tags: [Wallet & Cards]
      summary: Additional settings
      description: Dispatcher for additional user/operator settings. Returns `[]` for unknown actions.
      operationId: additionalSettings
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
            examples:
              default:
                value:
                  action: get_settings
      responses:
        "200":
          description: Settings payload
          content:
            application/json:
              schema:
                type: array
                items: {}
              example: []
  /publicapi/v1/rest_options/android_allsecure.php:
    post:
      tags: [Payments]
      summary: AllSecure payment operations
      description: |
        Payment gateway (AllSecure / Credorax) integration used for card payments,
        tokenization and validation. Class names in the APK: `AllSecureValidationApi`,
        `AllSecureFinalizeApi`, `AllSecureCheckStatusApi`.
      operationId: allsecurePayment
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  description: e.g. validate, finalize, check_status
            examples:
              default:
                value:
                  action: check_status
      responses:
        "200":
          description: Payment status payload
          content:
            application/json:
              schema:
                type: object
              example:
                success: true
  /publicapi/v1/rest_options/android_add_or_connect_card.php:
    post:
      tags: [Wallet & Cards]
      summary: Add or connect a transport card
      description: Attaches a physical NFC card or prepaid card to the user's account.
      operationId: addOrConnectCard
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                card_uid:
                  type: string
                  description: UID of the physical card being connected.
            examples:
              default:
                value:
                  action: connect_card
                  card_uid: "0490A1B2C3"
      responses:
        "200":
          description: Result of the card operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiStatus"
  /publicapi/v1/rest_options/android_prepaid_cards_log_online.php:
    post:
      tags: [Wallet & Cards]
      summary: Prepaid card online log
      description: Uploads or fetches the online log of prepaid card usage.
      operationId: prepaidCardsLog
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
            examples:
              default:
                value:
                  action: get_log
      responses:
        "200":
          description: Prepaid card log entries
          content:
            application/json:
              schema:
                type: array
                items: {}
              example: []
  /api/api.php:
    post:
      tags: [Misc]
      summary: Generic internal API dispatcher
      description: |
        Legacy/generic dispatcher. Responds with plain text `ERROR_MISSING_PARAMETERS`
        when the `ACTION` parameter is missing. Behaviour with valid actions is unknown —
        this endpoint is used by the web front-end.
      operationId: legacyApi
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ACTION:
                  type: string
                  description: Generic action verb.
            examples:
              default:
                value:
                  ACTION: get_version
      responses:
        "200":
          description: Legacy API payload
          content:
            application/json:
              schema:
                type: object
              example: {}
        "400":
          description: Missing ACTION parameter
          content:
            text/plain:
              schema:
                type: string
              example: ERROR_MISSING_PARAMETERS
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Authentication
      description: |
        Static API key compiled into the public NSmart Android app
        (resource `company_api_key`). Current value: `4670f468049bbee2260`
  schemas:
    City:
      type: object
      description: A city (municipality) in the GSPNS network.
      required: [id, name, default_station, coordinates, country, stations, pairs, slugs, has_train_station]
      properties:
        id:
          type: integer
          description: City ID. Novi Sad = 72.
          example: 72
        name:
          type: string
          description: City name (UTF-8, may contain escaped characters).
          example: Novi Sad
        gbname:
          type: string
          description: Google Business / geocoding name override (often empty).
          example: ""
        default_station:
          type: integer
          description: Default (central) station ID for the city. Novi Sad = 7.
          example: 7
        coordinates:
          $ref: "#/components/schemas/Coordinates"
        country:
          type: object
          required: [name, alpha2_code]
          properties:
            name:
              type: string
              example: Serbia
            alpha2_code:
              type: string
              example: RS
        classes:
          type: string
          description: Pipe/format string of fare classes (usually empty in the raw payload).
          example: ""
        stations:
          type: array
          description: All station IDs belonging to the city.
          items:
            type: integer
          example: [6801, 6548, 6726, 12883]
        pairs:
          type: array
          description: Line-pair IDs per station (used for route reconstruction).
          items:
            type: integer
          example: [72, 76, 1473, 72]
        slugs:
          type: string
          description: URL/geo slug of the city.
          example: novisad
        has_train_station:
          type: boolean
          description: Whether the city has a railway station.
          example: false
    Coordinates:
      type: object
      description: Geographic coordinates. Values are numbers (cities) or strings (stations).
      properties:
        latitude:
          oneOf:
            - type: number
            - type: string
          example: 45.2671352
        longitude:
          oneOf:
            - type: number
            - type: string
          example: 19.8335496
    Announcement:
      type: object
      description: Real-time prediction for one approaching vehicle at a station.
      required:
        - seconds_left
        - line_number
        - station_name
        - actual_line_number
        - stations_between
        - garage_no
        - line_title
        - main_line_title
        - vehicles
        - all_stations
      properties:
        seconds_left:
          type: integer
          description: Estimated seconds until the vehicle reaches this station.
          example: 1670
        line_number:
          type: string
          description: Line code of the approaching vehicle.
          example: "7A"
        stations_gpsx:
          type: string
          description: Station latitude as string.
          example: "45.2401130864"
        stations_gpsy:
          type: string
          description: Station longitude as string.
          example: "19.8370251247"
        station_name:
          type: string
          description: Name of the queried station.
          example: "Narodnog fronta-Šekspirova"
        actual_line_number:
          type: string
          description: Effective line code (same as line_number in practice).
          example: "7A"
        stations_between:
          type: integer
          description: |
            Number of stops the vehicle still has to call at *before* this station, so `0` means
            this station is its very next stop. If this station sits at index `t` in
            `all_stations`, the vehicle is heading for index `t - stations_between` (it is at or
            just past the stop before that). On loop lines, where the same station appears
            twice in `all_stations`, this is what tells the two passes apart: pick the
            occurrence whose `t - stations_between` entry lies nearest the vehicle.
          example: 17
        garage_no:
          type: string
          description: Physical vehicle (garage) number.
          example: "1102"
        line_title:
          type: string
          description: Full route description of the line.
          example: "NOVO NASELJE - ŽELEZNIČKA STANICA - FUTOŠKA PIJACA - LIMAN 4 - NOVO NASELJE"
        main_line_title:
          type: string
          description: Main/alternate route description.
          example: "NOVO NASELJE - ŽELEZNIČKA STANICA - FUTOŠKA PIJACA - LIMAN 4 - NOVO NASELJE"
        vehicles:
          type: array
          description: Live GPS positions of vehicles on this trip (usually one).
          items:
            $ref: "#/components/schemas/VehiclePosition"
        all_stations:
          type: array
          description: |
            Complete ordered station sequence of the line with coordinates — the whole line,
            not only the part the vehicle still has to drive.
          items:
            type: object
            required: [id, coordinates]
            properties:
              id:
                type: integer
                example: 13219
              coordinates:
                $ref: "#/components/schemas/Coordinates"
        station_uid:
          type: integer
          description: The queried station ID.
          example: 6532
    Network:
      type: object
      description: |
        Payload of `networkextended.php`. Besides `cities`, it carries the flat station and
        line lists (about 1000 stations and 100 lines for Novi Sad and its suburbs at the
        time of writing).
      required: [cities, stations, lines]
      properties:
        cities:
          type: array
          description: All cities in the network
          items:
            $ref: "#/components/schemas/City"
        stations:
          type: array
          description: Every station of every city, with its lines.
          items:
            $ref: "#/components/schemas/Station"
        lines:
          type: array
          description: Every line, one entry per direction variant.
          items:
            $ref: "#/components/schemas/Line"
        bike_sharing:
          type: object
          description: Bike-sharing pylons; the list is empty for Novi Sad.
          properties:
            pylons:
              type: array
              items:
                type: object
        smart_parking:
          type: object
          description: Smart-parking sensors; the list is empty for Novi Sad.
          properties:
            parking_sensors:
              type: array
              items:
                type: object
    Station:
      type: object
      description: A station (stop) from the network payload.
      required: [id, name, coordinates, city_id, city_name, lines_for_station]
      properties:
        id:
          type: integer
          description: Station ID — the value used as `station_uid` and in `Line.all_stations`.
          example: 6801
        name:
          type: string
          example: Agrovojvodina
        station_id:
          type: string
          description: Operator's own station code (not the numeric `id`).
          example: "0125PB"
        slugs:
          type: string
        city_id:
          type: integer
          example: 72
        city_name:
          type: string
          example: Novi Sad
        coordinates:
          type: object
          description: Position. Unlike `City.coordinates`, the values are **strings** here.
          required: [latitude, longitude]
          properties:
            latitude:
              type: string
              example: "45.3141430070"
            longitude:
              type: string
              example: "19.8293094486"
        pairs:
          type: array
          description: Line-pair IDs serving the station (may contain repeats).
          items:
            type: integer
        importance_order:
          type: integer
        train_station:
          type: boolean
        lines_for_station:
          type: array
          description: Display numbers of the lines that stop here.
          items:
            type: string
          example: ["35", "35ČL", "35L"]
        lines_for_station_additional_data:
          type: array
          items:
            type: object
            properties:
              line_number_for_display:
                type: string
                example: "35"
              vehicle_group:
                type: string
                example: "0"
              line_type:
                type: string
                description: Line class — `1`, `2` or `3` (see `Line.line_type`).
                example: "2"
              line_type_color_active:
                type: string
                example: "#000000"
              line_type_color_inactive:
                type: string
                example: "#000000"
    Line:
      type: object
      description: |
        A line (one direction variant) from the network payload.

        * `line_number_for_display` is the number riders know ("1", "7A") and is unique per
          entry. `line_number` / `actual_line_number` are the operator's internal codes and can
          differ from it (internal `10` is displayed as `1`, internal `41` as `10`, `101` as
          `10APT`) — use the display number when talking to riders, and match on it against
          `announcement.php`'s `line_number`.
        * `all_stations` is every leg of the line **concatenated** (outbound, branch
          variants and the return trip) — it is not a single one-way path. Return legs mostly
          use their own stop IDs, so the list does not repeat IDs at the turnaround.
        * A few stop IDs in `all_stations` are not present in `Network.stations`; skip them.
        * `line_type_color_active` was `#000000` for every line when checked, so it carries
          no usable line color.
      required: [id, line_number, line_number_for_display, line_title, all_stations]
      properties:
        id:
          type: string
          example: "21432"
        line_number:
          type: string
          description: Internal line code.
          example: "10"
        line_number_for_display:
          type: string
          description: Rider-facing line number.
          example: "1"
        actual_line_number:
          type: string
          example: "10"
        line_title:
          type: string
          example: "KLISA - CENTAR - LIMAN 1"
        line_title_for_display:
          type: string
        direction_id_for_display:
          type: string
          enum: ["A", "B"]
        price_variation_id:
          type: string
        line_type:
          type: string
          description: Line class (`1`, `2` or `3`).
          example: "1"
        line_type_color_active:
          type: string
          example: "#000000"
        line_type_color_inactive:
          type: string
          example: "#000000"
        all_stations:
          type: array
          description: Station IDs (as strings) in travel order, all legs concatenated.
          items:
            type: string
    VehiclePosition:
      type: object
      description: |
        Live GPS position of a vehicle. A vehicle with no GPS fix is reported at
        `lat: "0.00000000"`, `lng: "0.00000000"` — treat that as "unknown".
      required: [garageNo, lat, lng]
      properties:
        garageNo:
          type: string
          description: Vehicle/garage number (can be an empty string).
          example: "1102"
        lat:
          type: string
          description: Latitude as string.
          example: "45.24890660"
        lng:
          type: string
          description: Longitude as string.
          example: "19.79147330"
    ApiStatus:
      type: object
      description: Generic dispatcher status envelope.
      properties:
        success:
          type: boolean
          example: false
        msg:
          type: string
          example: SIGNUP_FORM_NOT_CONFIGURED
        code:
          type: integer
          description: Numeric error code (e.g. 3 = unknown station).
          example: 3
  responses:
    NetworkResponse:
      description: The complete network payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Network"
    AnnouncementError:
      description: Unknown station or no data
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ApiStatus"
          example:
            - success: false
              code: 3
    Forbidden:
      description: Missing/invalid API key or unauthenticated request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiStatus"
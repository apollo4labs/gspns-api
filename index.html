<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSPNS / NSmart Public Transport API — Novi Sad (OpenAPI docs)</title>
  <link rel="icon" type="image/png" href="swagger-ui/index.css">
  <link rel="stylesheet" href="swagger-ui/swagger-ui.css" id="swagger-css-local">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css"
        onerror="document.getElementById('swagger-css-local').removeAttribute('disabled')">
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #swagger-ui { max-width: 1460px; margin: 0 auto; }
    .banner {
      background: linear-gradient(135deg, #1a3a5c 0%, #25567f 100%);
      color: #fff; padding: 14px 24px; font-size: 14px;
    }
    .banner a { color: #7fd0ff; }
    .banner strong { color: #ffd75e; }
    .loading {
      padding: 60px 24px; text-align: center; color: #666; font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="banner">
    <strong>Unofficial &amp; reverse-engineered</strong> documentation of the GSPNS (JGSP "Novi Sad")
    public transport API — same backend used by the NSmart app. Not affiliated with GSPNS/NSmart.
    Source walkthrough: <a href="https://github.com/FmasterofU/NSmart-RE" target="_blank" rel="noopener">NSmart-RE</a> ·
    API key <code>4670f468049bbee2260</code> is compiled into the public Android APK.
  </div>
  <div id="swagger-ui"><div class="loading">Loading API documentation…</div></div>

  <script>
    // Load local assets first (vendored in this repo). If missing (e.g. partial clone),
    // fall back to the CDN.
    var localOK = false;
    var cdnStarted = false;
    function startSwagger() {
      if (typeof SwaggerUIBundle === "undefined") return;
      window.ui = SwaggerUIBundle({
        url: "openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayOperationId: true,
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 2,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        plugins: [SwaggerUIBundle.plugins.DownloadUrl],
        layout: "StandaloneLayout"
      });
    }
    function tryCDN() {
      if (cdnStarted) return;
      cdnStarted = true;
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js";
      s.onload = function () {
        var p = document.createElement("script");
        p.src = "https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js";
        p.onload = startSwagger;
        document.head.appendChild(p);
      };
      document.head.appendChild(s);
    }
  </script>
  <script src="swagger-ui/swagger-ui-bundle.js" onload="localOK=true; startSwagger()" onerror="tryCDN()"></script>
  <script src="swagger-ui/swagger-ui-standalone-preset.js" onload="startSwagger()" onerror="tryCDN()"></script>
  <script>window.addEventListener('load', function(){ if (!localOK) tryCDN(); });</script>
</body>
</html>

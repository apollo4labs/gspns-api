    Station:
      description: A station (stop) from the network payload.
      example:
        id: 6801
        name: Agrovojvodina
        station_id: 0125PB
        slugs: slugs
        city_id: 72
        city_name: Novi Sad
        coordinates:
          latitude: "45.3141430070"
          longitude: "19.8293094486"
        pairs:
        - 0
        - 0
        importance_order: 6
        train_station: true
        lines_for_station:
        - "35"
        - 35ČL
        - 35L
        lines_for_station_additional_data:
        - line_number_for_display: "35"
          vehicle_group: "0"
          line_type: "2"
          line_type_color_active: "#000000"
          line_type_color_inactive: "#000000"
        - line_number_for_display: "35"
          vehicle_group: "0"
          line_type: "2"
          line_type_color_active: "#000000"
          line_type_color_inactive: "#000000"
      properties:
        id:
          description: Station ID — the value used as `station_uid` and in `Line.all_stations`.
          example: 6801
          type: integer
        name:
          example: Agrovojvodina
          type: string
        station_id:
          description: Operator's own station code (not the numeric `id`).
          example: 0125PB
          type: string
        slugs:
          type: string
        city_id:
          example: 72
          type: integer
        city_name:
          example: Novi Sad
          type: string
        coordinates:
          $ref: "#/components/schemas/Station_coordinates"
        pairs:
          description: Line-pair IDs serving the station (may contain repeats).
          items:
            type: integer
          type: array
        importance_order:
          type: integer
        train_station:
          type: boolean
        lines_for_station:
          description: Display numbers of the lines that stop here.
          example:
          - "35"
          - 35ČL
          - 35L
          items:
            type: string
          type: array
        lines_for_station_additional_data:
          items:
            $ref: "#/components/schemas/Station_lines_for_station_additional_data_inner"
          type: array
      required:
      - city_id
      - city_name
      - coordinates
      - id
      - lines_for_station
      - name
      type: object
    Line:
      description: |
        A line (one direction variant) from the network payload.

        * `line_number_for_display` is the number riders know ("1", "7A") and is unique per
          entry. `line_number` / `actual_line_number` are the operator's internal codes and can
          differ from it (internal `10` is displayed as `1`, internal `41` as `10`, `101` as
          `10APT`) — use the display number when talking to riders, and match on it against
          `announcement.php`'s `line_number`.
        * `all_stations` is every leg of the line **concatenated** (outbound, branch
          variants and the return trip) — it is not a single one-way path. Return legs mostly
          use their own stop IDs, so the list does not repeat IDs at the turnaround.
        * A few stop IDs in `all_stations` are not present in `Network.stations`; skip them.
        * `line_type_color_active` was `#000000` for every line when checked, so it carries
          no usable line color.
      example:
        id: "21432"
        line_number: "10"
        line_number_for_display: "1"
        actual_line_number: "10"
        line_title: KLISA - CENTAR - LIMAN 1
        line_title_for_display: line_title_for_display
        direction_id_for_display: A
        price_variation_id: price_variation_id
        line_type: "1"
        line_type_color_active: "#000000"
        line_type_color_inactive: "#000000"
        all_stations:
        - all_stations
        - all_stations
      properties:
        id:
          example: "21432"
          type: string
        line_number:
          description: Internal line code.
          example: "10"
          type: string
        line_number_for_display:
          description: Rider-facing line number.
          example: "1"
          type: string
        actual_line_number:
          example: "10"
          type: string
        line_title:
          example: KLISA - CENTAR - LIMAN 1
          type: string
        line_title_for_display:
          type: string
        direction_id_for_display:
          enum:
          - A
          - B
          type: string
        price_variation_id:
          type: string
        line_type:
          description: "Line class (`1`, `2` or `3`)."
          example: "1"
          type: string
        line_type_color_active:
          example: "#000000"
          type: string
        line_type_color_inactive:
          example: "#000000"
          type: string
        all_stations:
          description: "Station IDs (as strings) in travel order, all legs concatenated."
          items:
            type: string
          type: array
      required:
      - all_stations
      - id
      - line_number
      - line_number_for_display
      - line_title
      type: object
    VehiclePosition:
      description: |
        Live GPS position of a vehicle. A vehicle with no GPS fix is reported at
        `lat: "0.00000000"`, `lng: "0.00000000"` — treat that as "unknown".
      example:
        garageNo: "1102"
        lat: "45.24890660"
        lng: "19.79147330"
      properties:
        garageNo:
          description: Vehicle/garage number (can be an empty string).
          example: "1102"
          type: string
        lat:
          description: Latitude as string.
          example: "45.24890660"
          type: string
        lng:
          description: Longitude as string.
          example: "19.79147330"
          type: string
      required:
      - garageNo
      - lat
      - lng
      type: object
    ApiStatus:
      description: Generic dispatcher status envelope.
      example:
        success: false
        msg: SIGNUP_FORM_NOT_CONFIGURED
        code: 3
      properties:
        success:
          example: false
          type: boolean
        msg:
          example: SIGNUP_FORM_NOT_CONFIGURED
          type: string
        code:
          description: Numeric error code (e.g. 3 = unknown station).
          example: 3
          type: integer
      type: object
    getNetwork_request:
